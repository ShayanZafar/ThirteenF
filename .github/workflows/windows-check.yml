# The whole check on Windows, run only when asked: the app is used on Windows, CI runs on
# Ubuntu, and a few things differ there (the update lock uses msvcrt, the .cmd scripts).
# Run it by hand from the Actions tab (Windows check > Run workflow, pick the branch), or
# add the label "windows-check" to a pull request. It never runs on its own.
name: Windows check

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'windows-check'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        shell: cmd
        run: scripts\setup.cmd

      - name: Verify
        shell: cmd
        run: scripts\verify.cmd
