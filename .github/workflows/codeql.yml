# CodeQL static analysis, free on public repositories: finds injection, path
# traversal, unsafe deserialization and similar bug classes with no model
# involved. Runs on pushes and pull requests to main, and weekly for new rules.
# Findings appear under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2" # Tuesdays, 07:41 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
