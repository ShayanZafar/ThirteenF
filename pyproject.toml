[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thirteenf"
version = "0.1.0"
description = "Are more funds holding it, or fewer? Form 13F holdings, filing period by filing period."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "mutmut>=3",
    "pip-licenses>=5",
    "playwright>=1.56",  # the browser tests (marked ui); Chromium comes from python -m playwright install chromium
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thirteenf = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the loaded SEC data in data/thirteenf.duckdb",
    "ui: drives the running app in a real browser (Playwright and Chromium), on stand-ins only",
]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.mutmut]
# Mutation testing (the test-gaps skill): mutates the app, runs the tests, and
# reports mutants no test noticed. Results go to mutants/, which is git-ignored.
paths_to_mutate = ["src/thirteenf/"]
tests_dir = ["tests/"]
also_copy = ["scripts/"]  # the tests of scripts/check_core_flows.py and check_claude_files.py load them

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF", "C90", "TID"]
ignore = [
    "E731",    # a named lambda is fine for a one-line helper
    "E501",    # the formatter sets line length; long SQL and HTML strings stay whole
    "SIM108",  # ternaries are not always clearer
    "RUF001", "RUF002", "RUF003",  # the design system uses the true minus sign (−) on purpose
]

[tool.ruff.lint.mccabe]
# Ratchet: lower it as functions are split up, never raise it.
max-complexity = 25

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"duckdb.connect".msg = "Use thirteenf.db.connect(), which waits for the write lock."

[tool.ruff.lint.per-file-ignores]
"src/thirteenf/db.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
