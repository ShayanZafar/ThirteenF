# The same check as scripts/verify.sh on your computer (formatting, lint,
# types, then the tests), run on every push to main and every pull request.
# Tests that need the SEC data skip here; the rest, the browser (UI) tests
# included, run on the small made-up data set with stand-ins for the SEC and
# OpenFIGI. A second pytest run then reports test coverage in the job summary
# (Actions tab, open the run): it never fails the build, it shows where the
# test-gaps skill should look next.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run that's still going.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: scripts/setup.sh

      # The UI tests (marked ui) drive Chromium through Playwright; this adds the
      # system libraries it needs on Ubuntu. setup.sh has already downloaded it.
      - name: Browser for the UI tests
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Verify
        run: scripts/verify.sh

      - name: Coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          .venv/bin/python -m pytest -q -p no:cacheprovider --cov=thirteenf --cov-report=term-missing:skip-covered | tee coverage.txt
          {
            echo '## Test coverage'
            echo
            echo '```'
            sed -n '/ coverage: platform /,$p' coverage.txt | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
