<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{% block title %}ThirteenF{% endblock %}</title>
<link rel="stylesheet" href="{{ asset('/ds/tokens.css') }}">
<link rel="stylesheet" href="{{ asset('/ds/components/bundle.css') }}">
<link rel="stylesheet" href="{{ asset('/static/app.css') }}">
</head>
<body>
<header class="app-bar">
<div class="app-bar__inner">
<a class="app-wordmark" href="/">ThirteenF</a>
<nav class="app-nav" aria-label="Main">
<a href="/stock"{% if nav == "lookup" %} aria-current="page"{% endif %}>Look up a stock</a>
<a href="/"{% if nav == "overview" %} aria-current="page"{% endif %}>Overview</a>
<a href="/changes"{% if nav == "changes" %} aria-current="page"{% endif %}>Biggest changes</a>
<a href="#method">Method</a>
</nav>
<div class="app-bar__end">
<form action="/search" method="get" role="search" class="app-row">
<label for="search" class="sr-only">Search</label>
<input id="search" name="q" type="search" class="app-input app-input--search" placeholder="Search a company or CUSIP" autocomplete="off">
</form>
<button type="button" class="app-button" id="theme-toggle" aria-pressed="{{ 'true' if theme == 'dark' else 'false' }}">{{ "Light" if theme == "dark" else "Dark" }}</button>
</div>
</div>
</header>
<main class="app-main">
{% block main %}{% endblock %}
</main>
<script>
(function () {
  var button = document.getElementById("theme-toggle");
  button.addEventListener("click", function () {
    var html = document.documentElement;
    var next = html.dataset.theme === "dark" ? "light" : "dark";
    html.dataset.theme = next;
    document.cookie = "tf_theme=" + next + "; path=/; max-age=31536000; samesite=lax";
    button.textContent = next === "dark" ? "Light" : "Dark";
    button.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
