kind = "web"
previewPath = "/"
title = "Stock Money Flow Tracker"
version = "1.0.0"
id = "artifacts/stock-flow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23833

[services.development]
run = "pnpm --filter @workspace/stock-flow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-flow", "run", "build" ]
publicDir = "artifacts/stock-flow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23833"
BASE_PATH = "/"
