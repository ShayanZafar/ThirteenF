<!-- @dsCard group="Page basics" height=200 subtitle="Headline numbers: filed facts in ink, the estimate in pen" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key figure — preview</title>
<style>
  .pv { padding: var(--space-4) var(--space-6) var(--space-6); display: grid; gap: var(--space-3); }
  .pv__top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); flex-wrap: wrap; }
</style>
</head>
<body>
<div class="pv">
  <div class="pv__top">
    <span class="type-caption tf-muted">Calder Freight · CLFR · Q2 2026</span>
    <span class="tf-sample">Sample data · fictional company</span>
  </div>
  <div class="tf-kfrow">
    <div class="tf-kf">
      <span class="tf-kf__label">Institutional ownership</span>
      <span class="tf-kf__value">71.4<span class="tf-kf__unit">%</span></span>
      <span class="tf-kf__delta tf-kf__delta--in"><span class="tf-dir tf-dir--in"></span><b>+3.2 pts</b> vs Q1</span>
    </div>
    <div class="tf-kf">
      <span class="tf-kf__label">Managers holding</span>
      <span class="tf-kf__value">214</span>
      <span class="tf-kf__delta tf-kf__delta--in"><span class="tf-dir tf-dir--in"></span><b>+19</b> vs Q1</span>
    </div>
    <div class="tf-kf">
      <span class="tf-kf__label">Net 13F flow, Q2</span>
      <span class="tf-kf__value">+$377M</span>
      <span class="tf-kf__delta">3.2% of shares</span>
    </div>
    <div class="tf-kf tf-kf--est">
      <span class="tf-kf__label">Price vs est. value</span>
      <span class="tf-kf__value">−31<span class="tf-kf__unit">% est.</span></span>
      <span class="tf-kf__delta">$50.30 vs $64–$82</span>
    </div>
  </div>
</div>
</body>
</html>
